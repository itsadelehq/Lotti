<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  #root {
    width: 100vw;
    height: 100vh;
  }
  canvas {
    width: 100% !important;
    height: 100% !important;
    display: block;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import React from 'https://esm.sh/react@18.3.1'
import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client'
import {
  ShaderGradientCanvas,
  ShaderGradient
} from 'https://esm.sh/@shadergradient/react@2?deps=react@18.3.1,react-dom@18.3.1,three@0.160.0,@react-three/fiber@8'

const e = React.createElement

createRoot(document.getElementById('root')).render(
  e(
    ShaderGradientCanvas,
    {
      style: { width: '100%', height: '100%', background: 'transparent' },
      pixelDensity: 1,
      fov: 45
    },
    e(ShaderGradient, {
      animate: 'on',
      control: 'props',
      color1: '#ff5005',
      color2: '#dbba95',
      color3: '#d0bce1',
      brightness: 1.2,
      cAzimuthAngle: 180,
      cDistance: 3.6,
      cPolarAngle: 90,
      cameraZoom: 1,
      envPreset: 'city',
      grain: 'on',
      lightType: '3d',
      type: 'plane',
      shader: 'defaults',
      positionX: -1.4,
      positionY: 0,
      positionZ: 0,
      rotationX: 0,
      rotationY: 10,
      rotationZ: 50,
      uAmplitude: 1,
      uDensity: 1.3,
      uFrequency: 5.5,
      uSpeed: 0.4,
      uStrength: 4,
      reflection: 0.1,
      frameRate: 10
    })
  )
)
</script>
</body>
</html>
