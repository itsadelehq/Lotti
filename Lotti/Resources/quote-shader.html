<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  #root {
    width: 100vw;
    height: 100vh;
  }
  canvas {
    width: 100% !important;
    height: 100% !important;
    display: block;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import React from 'https://esm.sh/react@18.3.1'
import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client'
import {
  ShaderGradientCanvas,
  ShaderGradient
} from 'https://esm.sh/@shadergradient/react@2?deps=react@18.3.1,react-dom@18.3.1,three@0.160.0,@react-three/fiber@8'

const e = React.createElement

// Reads the daily preset (colors + type) from the URL query string, e.g.
// `quote-shader.html?c1=d975b9&c2=db55bc&c3=d4202f&type=plane`, falling back
// to the original defaults when a param is missing (or the page is opened
// with no query string at all).
function normalizeHex(value, fallback) {
  if (!value) return fallback
  const hex = value.replace(/^#/, '').replace(/^%23/, '')
  return '#' + hex
}

const params = new URLSearchParams(window.location.search)
const color1 = normalizeHex(params.get('c1'), '#ff5005')
const color2 = normalizeHex(params.get('c2'), '#dbba95')
const color3 = normalizeHex(params.get('c3'), '#d0bce1')
const shaderType = params.get('type') === 'waterPlane' ? 'waterPlane' : (params.get('type') === 'plane' ? 'plane' : 'plane')
const cDistance = params.get('cDistance') ? parseFloat(params.get('cDistance')) : 3.6

createRoot(document.getElementById('root')).render(
  e(
    ShaderGradientCanvas,
    {
      style: { width: '100%', height: '100%', background: 'transparent' },
      pixelDensity: 1,
      fov: 45
    },
    e(ShaderGradient, {
      animate: 'on',
      control: 'props',
      color1: color1,
      color2: color2,
      color3: color3,
      brightness: 1.2,
      cAzimuthAngle: 180,
      cDistance: cDistance,
      cPolarAngle: 90,
      cameraZoom: 1,
      envPreset: 'city',
      grain: 'on',
      lightType: '3d',
      type: shaderType,
      shader: 'defaults',
      positionX: -1.4,
      positionY: 0,
      positionZ: 0,
      rotationX: 0,
      rotationY: 10,
      rotationZ: 50,
      uAmplitude: 1,
      uDensity: 1.3,
      uFrequency: 5.5,
      uSpeed: 0.4,
      uStrength: 4,
      reflection: 0.1,
      frameRate: 10
    })
  )
)
</script>
</body>
</html>
